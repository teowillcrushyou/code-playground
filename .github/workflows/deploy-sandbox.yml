name: Deploy permanent sandbox hub

on:
  push:
    branches:
      - sandbox-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teoisthewinner-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the workshop
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the main-site boundary
        run: npm test

      - name: Build and test the permanent sandbox hub
        env:
          TEO_SANDBOX_BUILD: "1"
        run: |
          npm run build
          npm run package:sandbox
          npm run test:sandbox

      - name: Enforce a static-only sandbox release
        shell: bash
        run: |
          if find candidate -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in a sandbox release." >&2
            exit 1
          fi
          if find candidate -type f \( \
            -iname '*.php' -o -iname '*.phtml' -o -iname '*.phar' -o \
            -iname '*.cgi' -o -iname '*.pl' -o -iname '*.py' -o -iname '*.rb' -o \
            -iname '.htaccess' -o -iname '.user.ini' \
          \) -print -quit | grep -q .; then
            echo "Executable or server-configuration files are not allowed." >&2
            exit 1
          fi

      - name: Install the FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload the hub to guarded staging
        env:
          FTPS_PASSWORD: ${{ secrets.TEO_FTPS_PASSWORD }}
        shell: bash
        run: |
          test -n "$FTPS_PASSWORD"
          printf '%s' "$GITHUB_SHA" > .sandbox-ready
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 20;
            open -p 21 -u 'teo@teoisthewinner.com',\"$FTPS_PASSWORD\" 'ftp://secure367.inmotionhosting.com';
            mirror --reverse --delete --verbose=1 --parallel=4 ./candidate/ /.sandbox-candidate/;
            put .sandbox-ready -o /.sandbox-candidate/.sandbox-ready;
            bye
          "
